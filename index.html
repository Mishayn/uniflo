<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIZA Rozvrh & Mapa</title>
    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #121316;
            --bg-card: #1c1e22;
            --bg-card-hover: #25282e;
            --bg-input: #292d34;
            --border-color: #2e323b;
            --text-primary: #f0f2f5;
            --text-secondary: #9aa0a6;
            --text-muted: #626873;

            /* Subject Types Colors */
            --color-prednaska: #22c55e; /* GREEN */
            --color-prednaska-bg: rgba(34, 197, 94, 0.18);
            
            --color-cvicenie: #3b82f6;  /* BLUE */
            --color-cvicenie-bg: rgba(59, 130, 246, 0.18);
            
            --color-lab: #ef4444;       /* RED */
            --color-lab-bg: rgba(239, 68, 68, 0.18);

            --accent-orange: #f97316;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 1550px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .group-selector-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .group-input {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            width: 110px;
            outline: none;
            text-transform: uppercase;
        }

        /* e-vzd quick dynamic link button */
        .btn-evzd {
            background: var(--bg-input);
            color: var(--accent-orange);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .btn-evzd:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent-orange);
        }

        /* Action Buttons above Najbližší deň */
        .schedule-actions-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn-main-action {
            flex: 1;
            background: var(--accent-orange);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-main-action:hover { opacity: 0.9; }

        .btn-square-reset {
            width: 40px;
            height: 40px;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .btn-square-reset:hover { background: rgba(239, 68, 68, 0.3); }

        /* Desktop Grid Layout (3 Columns) */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            padding: 16px;
            flex: 1;
        }

        @media (min-width: 1200px) {
            .dashboard-grid {
                grid-template-columns: 1.15fr 0.85fr 0.7fr; 
                align-items: start;
            }

            .bottom-nav {
                display: none !important;
            }

            .screen {
                display: block !important;
            }
        }

        @media (max-width: 1199px) {
            body { padding-bottom: 70px; }
            .dashboard-grid { display: block; padding: 12px; }
            .screen { display: none; }
            .screen.active { display: block; }
        }

        /* Universal Column Layout */
        .dash-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .dash-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
        }

        .dash-column-3 {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .section-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* Cards & Badges */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card-item {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .card-item.type-prednaska::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--color-prednaska); }
        .card-item.type-cvicenie::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--color-cvicenie); }
        .card-item.type-laboratorne::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--color-lab); }

        .card-time { display: flex; flex-direction: column; min-width: 90px; }
        .time-range { font-size: 0.9rem; font-weight: 700; }
        .time-block { font-size: 0.7rem; color: var(--text-muted); }

        .card-main { flex: 1; padding: 0 10px; }
        .subject-title { font-size: 0.92rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }

        .badge { font-size: 0.68rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; text-transform: lowercase; }
        .badge-prednaska { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-cvicenie { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
        .badge-laboratorne { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        .teacher-name { font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px; }
        .room-code { font-size: 0.92rem; font-weight: 700; }

        /* Weekly View Grid Fixed Size */
        .week-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            max-height: 545px;
        }

        .week-grid {
            display: grid;
            grid-template-columns: 45px repeat(5, minmax(95px, 1fr));
            position: relative;
        }

        .week-header-cell {
            padding: 8px 4px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            font-size: 0.78rem;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .week-time-cell {
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.68rem;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            border-right: 1px solid var(--border-color);
        }

        .week-day-column {
            border-right: 1px solid var(--border-color);
            position: relative;
            height: 494px;
            background-size: 100% 38px;
            background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .week-card {
            border-radius: 5px;
            padding: 3px 5px;
            font-size: 0.7rem;
            overflow: hidden;
            cursor: pointer;
            box-sizing: border-box;
        }

        .week-card.prednáška { background: var(--color-prednaska-bg); border: 1px solid var(--color-prednaska); color: #86efac; }
        .week-card.cvičenie { background: var(--color-cvicenie-bg); border: 1px solid var(--color-cvicenie); color: #93c5fd; }
        .week-card.laboratórne { background: var(--color-lab-bg); border: 1px solid var(--color-lab); color: #fca5a5; }

        .week-gap-box {
            position: absolute;
            left: 2px;
            right: 2px;
            border: 1px dashed var(--border-color);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.68rem;
            color: var(--text-muted);
            pointer-events: none;
            box-sizing: border-box;
        }

        /* Map Container */
        #map-container {
            width: 100%;
            height: 352px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            overflow: hidden;
            margin-top: 6px;
        }

        .map-building-list {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .chip {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 14px;
            font-size: 0.72rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .chip-admin {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
            color: #fca5a5;
            font-weight: 600;
        }

        .chip-gps { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; color: #60a5fa; font-weight: 600; }

        /* Google-like GPS Pulse Marker Styles */
        .user-pulse-marker {
            background: rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        .user-dot-marker {
            background: #2563eb;
            border: 3px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.5);
        }

        /* Compact Calendar with matched dimensions */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
        }

        .cal-day-label { font-size: 0.7rem; color: var(--text-muted); padding-bottom: 3px; font-weight: 600; }
        .cal-day {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 6px 0;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .cal-day.active { border-color: var(--accent-orange); background: rgba(249, 115, 22, 0.15); font-weight: 700; color: var(--accent-orange); }
        .cal-day.other-month { opacity: 0.25; }

        /* Clock Box */
        .clock-box {
            text-align: center;
            background: var(--bg-input);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 10px;
        }
        .clock-time { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
        .clock-date { font-size: 0.78rem; color: var(--text-secondary); }

        /* Online Chat Styles */
        .chat-box {
            display: flex;
            flex-direction: column;
            height: 250px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            padding: 8px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-msg {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            line-height: 1.3;
        }
        .chat-msg-author {
            font-weight: 700;
            color: var(--accent-orange);
            margin-bottom: 2px;
        }
        .chat-input-area {
            display: flex;
            border-top: 1px solid var(--border-color);
            background: var(--bg-card);
            padding: 6px;
            gap: 6px;
        }
        .chat-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 8px;
            color: var(--text-primary);
            font-size: 0.8rem;
            outline: none;
        }
        .chat-send-btn {
            background: var(--accent-orange);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Promo Cards Style */
        .promo-card {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .promo-card.highlighted {
            border-color: rgba(239, 68, 68, 0.4);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.08), var(--bg-main));
        }
        .promo-logo {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .promo-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .promo-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .promo-desc {
            font-size: 0.72rem;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        /* Bottom Nav Mobile */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(28, 30, 34, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 6px 0;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.7rem;
            cursor: pointer;
            width: 20%;
        }

        .nav-item svg { width: 20px; height: 20px; fill: currentColor; }
        .nav-item.active { color: var(--accent-orange); font-weight: 600; }

        /* Modals */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            width: 100%;
            max-width: 440px;
            padding: 18px;
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-title { font-size: 1rem; font-weight: 700; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 3px; }
        .form-control {
            width: 100%;
            padding: 8px 10px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            outline: none;
            font-size: 0.85rem;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            background: var(--accent-orange);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 600;
